<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#08191c"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c7ff6b"/><stop offset=".48" stop-color="#79d9ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="1280" height="640" rx="30" fill="url(#bg)"/>
  <circle cx="140" cy="110" r="160" fill="#7c3aed" opacity=".18" filter="url(#blur)"/>
  <circle cx="1140" cy="545" r="190" fill="#06b6d4" opacity=".16" filter="url(#blur)"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="72" y="72" width="52" height="52" rx="15" fill="#c7ff6b"/><text x="98" y="106" text-anchor="middle" fill="#10130c" font-family="ui-monospace,monospace" font-size="20" font-weight="800">&gt;_</text>
    <text x="142" y="108" fill="#f8fafc" font-size="26" font-weight="800">hello.world</text>
    <text x="72" y="245" fill="#f8fafc" font-size="72" font-weight="800">Hello World Atlas</text>
    <text x="72" y="325" fill="url(#g)" font-size="54" font-weight="800">One greeting. 52 languages.</text>
    <text x="75" y="380" fill="#94a3b8" font-size="25">Explore · Compare · Learn · Play</text>
    <text x="75" y="520" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="20">print("Hello, World!")  ·  println!("Hello, World!")  ·  fmt.Println("Hello, World!")</text>
    <text x="75" y="570" fill="#64748b" font-size="18">Different syntax. Different eras. Same little spark.</text>
  </g>
</svg>