<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b12"/><stop offset="1" stop-color="#08161b"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c7ff6b"/><stop offset=".5" stop-color="#79d9ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="80" y="95" fill="#9ba1b2" font-size="17" letter-spacing="4">THE UPGRADED ATLAS</text>
    <text x="80" y="165" fill="#f8fafc" font-size="52" font-weight="800">Explore. Compare. Learn. Play.</text>
    <text x="80" y="205" fill="#94a3b8" font-size="20">A tiny programming-language museum built around Hello, World!</text>
  </g>
  <g transform="translate(80 250)" font-family="Inter,Arial,sans-serif">
    <rect width="590" height="230" rx="22" fill="#111827" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="28" y="40" fill="#79d9ff" font-size="14" letter-spacing="2">COMPARE</text>
    <text x="28" y="78" fill="#f8fafc" font-size="26" font-weight="800">Python  ↔  Rust</text>
    <text x="28" y="116" fill="#94a3b8" font-size="16">Dynamic · Interpreted · # comments</text>
    <text x="300" y="116" fill="#94a3b8" font-size="16">Static · Compiled · // comments</text>
    <rect x="28" y="142" width="240" height="60" rx="12" fill="#090d16"/><text x="46" y="179" fill="#86efac" font-family="ui-monospace,monospace" font-size="17">print("Hello, World!")</text>
    <rect x="296" y="142" width="266" height="60" rx="12" fill="#090d16"/><text x="315" y="179" fill="#86efac" font-family="ui-monospace,monospace" font-size="17">println!("Hello, World!");</text>

    <rect x="630" width="590" height="230" rx="22" fill="#111827" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="658" y="40" fill="#c7ff6b" font-size="14" letter-spacing="2">LEARN</text>
    <text x="658" y="78" fill="#f8fafc" font-size="26" font-weight="800">Language Passport</text>
    <g font-size="15">
      <text x="658" y="120" fill="#94a3b8">Born</text><text x="730" y="120" fill="#fff" font-weight="700">1991</text>
      <text x="858" y="120" fill="#94a3b8">Typing</text><text x="936" y="120" fill="#fff" font-weight="700">Dynamic</text>
      <text x="658" y="158" fill="#94a3b8">Comment</text><text x="746" y="158" fill="#fff" font-weight="700">#</text>
      <text x="858" y="158" fill="#94a3b8">Use</text><text x="910" y="158" fill="#fff" font-weight="700">AI · Web · Automation</text>
    </g>

    <rect y="270" width="590" height="230" rx="22" fill="#111827" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="28" y="310" fill="#a78bfa" font-size="14" letter-spacing="2">COMMENT ATLAS</text>
    <text x="28" y="348" fill="#f8fafc" font-size="26" font-weight="800">52 ways to write nothing.</text>
    <g font-family="ui-monospace,monospace" font-size="18">
      <text x="28" y="395" fill="#67e8f9">//</text><text x="72" y="395" fill="#94a3b8">C · C++ · JS · Rust · Go · Swift</text>
      <text x="28" y="430" fill="#67e8f9">#</text><text x="72" y="430" fill="#94a3b8">Python · Ruby · Bash · PowerShell</text>
      <text x="28" y="465" fill="#67e8f9">--</text><text x="72" y="465" fill="#94a3b8">SQL · Haskell · Lua · Ada</text>
    </g>

    <rect x="630" y="270" width="590" height="230" rx="22" fill="#111827" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="658" y="310" fill="#ffb68a" font-size="14" letter-spacing="2">PLAY</text>
    <text x="658" y="348" fill="#f8fafc" font-size="26" font-weight="800">Guess the Language</text>
    <rect x="658" y="370" width="530" height="62" rx="12" fill="#090d16"/>
    <text x="684" y="408" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="18">fn main() { println!("Hello, World!"); }</text>
    <g font-size="15" font-weight="700"><rect x="658" y="450" width="105" height="36" rx="10" fill="#ffffff" fill-opacity=".07"/><text x="689" y="474" fill="#cbd5e1">Go</text><rect x="776" y="450" width="105" height="36" rx="10" fill="#8b5cf6"/><text x="807" y="474" fill="#fff">Rust</text><rect x="894" y="450" width="105" height="36" rx="10" fill="#ffffff" fill-opacity=".07"/><text x="923" y="474" fill="#cbd5e1">Swift</text></g>
  </g>
  <text x="700" y="785" text-anchor="middle" fill="url(#g)" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">One greeting · 52 languages · Infinite beginnings</text>
</svg>